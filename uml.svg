<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><rect width="1100" height="660" fill="#faf7f1"/><g font-family="Arial,sans-serif" fill="#263e3b"><text x="45" y="55" font-size="27" font-weight="bold">Clinic Patient Manager · Class Structure</text><text x="45" y="86" font-size="15">Ragad Mohammad Eid / Python console project</text></g><g fill="white" stroke="#b78361" stroke-width="2"><rect x="45" y="130" width="420" height="270" rx="12"/><rect x="635" y="130" width="420" height="270" rx="12"/><path d="M465 260H635" fill="none"/><path d="m620 253 15 7-15 7" fill="none"/><rect x="45" y="460" width="1010" height="145" rx="12"/></g><g font-family="monospace" fill="#263e3b" font-size="17"><text x="70" y="165" font-weight="bold">Admin</text><text x="70" y="205">+ patients: dict[str, Patient]</text><text x="70" y="235">+ treatments: list[str]</text><text x="70" y="280">+ __init__()</text><text x="70" y="310">+ add() / edit() / delete()</text><text x="70" y="340">+ search() / showAll()</text><text x="70" y="370">+ treatmentsPage()</text><text x="660" y="165" font-weight="bold">Patient</text><text x="660" y="205">+ id, fname, lname: str</text><text x="660" y="235">+ email, phoneNumber: str</text><text x="660" y="265">+ password: str</text><text x="660" y="295">+ treatments: list[str]</text><text x="660" y="335">+ __init__(...) / __str__()</text><text x="481" y="240" font-size="12">stores 0..*</text><text x="70" y="495" font-weight="bold">Module functions (not a class)</text><text x="70" y="530">adminPage() → uses the global Admin instance</text><text x="70" y="558">patientPage() → accesses a Patient through Admin.patients</text><text x="70" y="586">ClinicPatientManagementSystem() → routes the main menu</text></g><text x="45" y="640" font-family="Arial" font-size="13" fill="#666">Fields are public in the source code. Association shows stored object references, not inheritance.</text></svg>